# =============================================================================
# Configuración del cliente REST
# =============================================================================
# URL base del web service desplegado en Payara.
#
#   http://localhost:8080/criminal_justice_ws/api/v1
#                        └── context-root ──┘└ @ApplicationPath ┘
#
# Se puede sobreescribir sin recompilar, en este orden de prioridad:
#   1. Propiedad del sistema:  -Dcjs.api.url=http://otro-host:8080/...
#   2. Variable de entorno:    CJS_API_URL
#   3. Este archivo
api.baseUrl=http://localhost:8080/criminal_justice_ws/api/v1

# Tiempo máximo de espera por respuesta, en segundos.
api.timeoutSeconds=15
